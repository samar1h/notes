---
layout: base
---
<nav class="note-nav">
  <a href="{{ site.baseurl }}/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Notes
  </a>
  <span class="note-badge">note</span>
</nav>

<article>
  <h1 class="note-title">{{ page.title }}</h1>
  <div class="note-meta">
    <span>{{ page.date | date: "%B %-d, %Y" }}</span>
    {% for tag in page.tags %}<span>#{{ tag }}</span>{% endfor %}
  </div>
  <div class="note-body">{{ content }}</div>
</article>

<div class="note-foot">
  <a href="{{ site.baseurl }}/" class="back-foot">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to notes
  </a>
  {% for tag in page.tags %}
  <a href="{{ site.baseurl }}/?tag={{ tag }}" class="n-tag">#{{ tag }}</a>
  {% endfor %}
</div>
