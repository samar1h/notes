---
layout: base
---
<nav class="note-nav">
  <a href="{{ site.baseurl }}/" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Notes
  </a>
  <!-- <span class="note-badge">note</span> -->
</nav>

<article>
  <center><h1 class="note-title">{{ page.title }}</h1></center>
  <div class="note-meta">
    <center><p>{{ page.date | date: "%B %-d, %Y" }}</p></center>
    {% for tag in page.tags %}
    <a href="{{ site.baseurl }}/?tag={{ tag }}" class="meta-tag">#{{ tag }}</a>
    {% endfor %}
  </div>
    
  <div class="note-body">{{ content }}</div>
</article>
