<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* --------------------- CSS Custom Properties --------------------- */
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --surface-hover: #2a2a2a;
      --text: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent-hue: 210;
      --accent: hsl(var(--accent-hue), 70%, 60%);
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.4);
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-size: 16px;
      --text-align: left;
      --header-height: 56px;
      --max-width: 720px;
    }

    /* Theme variants */
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --surface-hover: #f0f0f0;
      --text: #1a1a1a;
      --text-secondary: #666;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]):not([data-theme="light"]) {
        --bg: #f5f5f5;
        --surface: #ffffff;
        --surface-hover: #f0f0f0;
        --text: #1a1a1a;
        --text-secondary: #666;
        --shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
    }

    /* Accent colour classes */
    [data-accent="red"]    { --accent-hue: 0; }
    [data-accent="orange"] { --accent-hue: 30; }
    [data-accent="yellow"] { --accent-hue: 50; }
    [data-accent="green"]  { --accent-hue: 140; }
    [data-accent="teal"]   { --accent-hue: 180; }
    [data-accent="blue"]   { --accent-hue: 210; }
    [data-accent="purple"] { --accent-hue: 270; }
    [data-accent="pink"]   { --accent-hue: 330; }

    [data-font-size="small"]  { --font-size: 14px; }
    [data-font-size="medium"] { --font-size: 16px; }
    [data-font-size="large"]  { --font-size: 18px; }

    [data-font-family="system"] { --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    [data-font-family="serif"]  { --font-family: 'Lora', Georgia, serif; }
    [data-font-family="sans"]   { --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

    [data-text-align="center"]  { --text-align: center; }
    [data-text-align="right"]   { --text-align: right; }
    [data-text-align="justify"] { --text-align: justify; }

    /* Resets */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family);
      font-size: var(--font-size);
      text-align: var(--text-align);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background 0.2s, color 0.2s;
    }
    a { color: var(--accent); text-decoration: none; }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid rgba(128,128,128,0.15);
      backdrop-filter: blur(10px);
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }
    .app-title {
      font-weight: 600;
      font-size: 20px;
      white-space: nowrap;
    }
    .search-wrapper {
      flex: 1;
      position: relative;
    }
    .search-wrapper input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border-radius: 24px;
      border: 1px solid rgba(128,128,128,0.2);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    .search-wrapper input:focus {
      border-color: var(--accent);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
    }
    .icon-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      transition: background 0.2s;
      display: flex;
    }
    .icon-btn:hover { background: var(--surface-hover); }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 8px;
    }
    select.toolbar-select {
      background: var(--surface);
      border: 1px solid rgba(128,128,128,0.2);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .tag-filter-btn {
      margin-left: auto;
    }

    /* Cards */
    .notes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
      max-width: var(--max-width);
      margin: 0 auto;
    }
    @media (min-width: 480px) {
      .notes-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .note-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .note-card:hover { background: var(--surface-hover); }
    .note-card:active { transform: scale(0.98); }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card-tag {
      background: hsla(var(--accent-hue), 70%, 60%, 0.15);
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .card-date {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .card-title {
      font-weight: 600;
      font-size: 1.1em;
      line-height: 1.3;
    }
    .card-excerpt {
      color: var(--text-secondary);
      font-size: 0.9em;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Settings modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: var(--max-width);
      border-radius: 20px 20px 0 0;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .modal-header h2 { font-weight: 600; }
    .setting-group {
      margin-bottom: 20px;
    }
    .setting-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.7;
    }
    .swatch-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-swatch.active { border-color: var(--text); transform: scale(1.1); }
    .option-btn {
      background: var(--surface-hover);
      border: 1px solid transparent;
      padding: 6px 14px;
      border-radius: 8px;
      color: var(--text);
      margin-right: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .option-btn.active { border-color: var(--accent); background: hsla(var(--accent-hue), 70%, 60%, 0.15); }
  </style>
</head>
<body>
  {% if page.layout == "note" %}
    <!-- Note page header -->
    <header class="app-header">
      <a href="{{ '/' | relative_url }}" class="icon-btn" aria-label="Back">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7l-7 7 7 7"/></svg>
      </a>
      <span class="app-title" style="flex:1; text-align:center;">Note: {{ page.title }}</span>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </header>
    <main style="max-width: var(--max-width); margin: 0 auto; padding: 20px 16px;">
      {{ content }}
    </main>
  {% else %}
    <!-- Home page header -->
    <header class="app-header">
      <span class="app-title">Notes</span>
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="M15 15l4 4"/></svg>
        <input type="search" id="searchInput" placeholder="Search notes..." autocomplete="off">
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </header>
    <div class="toolbar">
      <select id="sortSelect" class="toolbar-select">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="title-asc">Title A–Z</option>
        <option value="title-desc">Title Z–A</option>
      </select>
      <button id="tagFilterBtn" class="option-btn tag-filter-btn">Tags</button>
      <div id="activeTagLabel" style="font-size:12px; color:var(--text-secondary);"></div>
    </div>
    <div id="tagDropdown" style="display:none; padding:0 16px 8px; flex-wrap:wrap; gap:6px;"></div>
    <div class="notes-grid" id="notesContainer"></div>
    <div id="noResults" style="text-align:center; padding:40px; color:var(--text-secondary); display:none;">No notes found</div>
  {% endif %}

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="icon-btn" id="closeSettings"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="setting-group">
        <label>Theme</label>
        <div id="themeOptions">
          <button class="option-btn" data-value="dark">Dark</button>
          <button class="option-btn" data-value="light">Light</button>
          <button class="option-btn" data-value="system">System</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Accent colour</label>
        <div class="swatch-row" id="accentSwatches">
          <span class="color-swatch" data-color="red" style="background:#f44336;"></span>
          <span class="color-swatch" data-color="orange" style="background:#ff9800;"></span>
          <span class="color-swatch" data-color="yellow" style="background:#ffeb3b;"></span>
          <span class="color-swatch" data-color="green" style="background:#4caf50;"></span>
          <span class="color-swatch" data-color="teal" style="background:#009688;"></span>
          <span class="color-swatch active" data-color="blue" style="background:#42a5f5;"></span>
          <span class="color-swatch" data-color="purple" style="background:#ab47bc;"></span>
          <span class="color-swatch" data-color="pink" style="background:#ec407a;"></span>
        </div>
      </div>
      <div class="setting-group">
        <label>Font size</label>
        <div id="fontSizeOptions">
          <button class="option-btn" data-value="small">Small</button>
          <button class="option-btn active" data-value="medium">Medium</button>
          <button class="option-btn" data-value="large">Large</button>
        </div>
      </div>
      <div class="setting-group">
        <label>Font family</label>
        <select id="fontFamilySelect" class="toolbar-select" style="width:100%;">
          <option value="sans">Sans-serif (Inter)</option>
          <option value="serif">Serif (Lora)</option>
          <option value="system">System default</option>
        </select>
      </div>
      <div class="setting-group">
        <label>Text alignment</label>
        <div id="textAlignOptions">
          <button class="option-btn active" data-value="left">Left</button>
          <button class="option-btn" data-value="center">Center</button>
          <button class="option-btn" data-value="right">Right</button>
          <button class="option-btn" data-value="justify">Justify</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts (only for home page) -->
  {% if page.layout != "note" %}
  <script src="https://unpkg.com/lunr/lunr.js"></script>
  <script>
    (function() {
      // --- Settings management ---
      const html = document.documentElement;
      const body = document.body;
      const STORAGE_KEY = 'notes-settings';
      const defaults = {
        theme: 'dark',
        accent: 'blue',
        fontSize: 'medium',
        fontFamily: 'sans',
        textAlign: 'left'
      };
      let settings = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaults;

      function applySettings() {
        html.setAttribute('data-theme', settings.theme);
        html.setAttribute('data-accent', settings.accent);
        html.setAttribute('data-font-size', settings.fontSize);
        html.setAttribute('data-font-family', settings.fontFamily);
        html.setAttribute('data-text-align', settings.textAlign);
      }
      function saveSettings() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        applySettings();
      }
      function setActive(containerId, value) {
        document.querySelectorAll(`#${containerId} .option-btn, #${containerId} .color-swatch`).forEach(el => el.classList.remove('active'));
        const activeEl = document.querySelector(`#${containerId} [data-value="${value}"], #${containerId} [data-color="${value}"]`);
        if (activeEl) activeEl.classList.add('active');
      }
      applySettings();

      // Modal open/close
      const modal = document.getElementById('settingsModal');
      document.getElementById('settingsBtn').addEventListener('click', () => modal.classList.add('active'));
      document.getElementById('closeSettings').addEventListener('click', () => modal.classList.remove('active'));
      modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.remove('active'); });

      // Theme
      document.querySelectorAll('#themeOptions .option-btn').forEach(btn => {
        if(btn.dataset.value === settings.theme) btn.classList.add('active');
        btn.addEventListener('click', () => {
          settings.theme = btn.dataset.value;
          setActive('themeOptions', settings.theme);
          saveSettings();
        });
      });
      // Accent
      document.querySelectorAll('#accentSwatches .color-swatch').forEach(sw => {
        if(sw.dataset.color === settings.accent) sw.classList.add('active');
        sw.addEventListener('click', () => {
          settings.accent = sw.dataset.color;
          setActive('accentSwatches', settings.accent);
          saveSettings();
        });
      });
      // Font size
      document.querySelectorAll('#fontSizeOptions .option-btn').forEach(btn => {
        if(btn.dataset.value === settings.fontSize) btn.classList.add('active');
        btn.addEventListener('click', () => {
          settings.fontSize = btn.dataset.value;
          setActive('fontSizeOptions', settings.fontSize);
          saveSettings();
        });
      });
      // Font family
      const fontSelect = document.getElementById('fontFamilySelect');
      fontSelect.value = settings.fontFamily;
      fontSelect.addEventListener('change', () => {
        settings.fontFamily = fontSelect.value;
        saveSettings();
      });
      // Text alignment
      document.querySelectorAll('#textAlignOptions .option-btn').forEach(btn => {
        if(btn.dataset.value === settings.textAlign) btn.classList.add('active');
        btn.addEventListener('click', () => {
          settings.textAlign = btn.dataset.value;
          setActive('textAlignOptions', settings.textAlign);
          saveSettings();
        });
      });

      // --- Notes data & UI ---
      let allNotes = [];
      let currentTag = null; // null = show all
      let currentSearchTerm = '';

      const notesContainer = document.getElementById('notesContainer');
      const noResults = document.getElementById('noResults');
      const searchInput = document.getElementById('searchInput');
      const sortSelect = document.getElementById('sortSelect');
      const tagFilterBtn = document.getElementById('tagFilterBtn');
      const tagDropdown = document.getElementById('tagDropdown');
      const activeTagLabel = document.getElementById('activeTagLabel');

      // Fetch notes.json
      fetch('{{ '/notes.json' | relative_url }}')
        .then(res => res.json())
        .then(data => {
          allNotes = data;
          buildLunrIndex(data);
          renderTags(data);
          applyFiltersAndSort();
        })
        .catch(err => console.error('Failed to load notes:', err));

      // Build Lunr index
      let idx;
      function buildLunrIndex(notes) {
        idx = lunr(function() {
          this.ref('url');
          this.field('title');
          this.field('tags');
          this.field('content');
          notes.forEach(note => this.add(note));
        });
      }

      // Render tag cloud
      function renderTags(notes) {
        const tagSet = new Set();
        notes.forEach(n => n.tags.forEach(t => tagSet.add(t)));
        const tags = Array.from(tagSet).sort();
        tagDropdown.innerHTML = '';
        const allBtn = document.createElement('button');
        allBtn.className = 'option-btn' + (currentTag === null ? ' active' : '');
        allBtn.textContent = 'All';
        allBtn.addEventListener('click', () => {
          currentTag = null;
          activeTagLabel.textContent = '';
          tagDropdown.style.display = 'none';
          applyFiltersAndSort();
        });
        tagDropdown.appendChild(allBtn);
        tags.forEach(tag => {
          const b = document.createElement('button');
          b.className = 'option-btn' + (currentTag === tag ? ' active' : '');
          b.textContent = tag;
          b.addEventListener('click', () => {
            currentTag = tag;
            activeTagLabel.textContent = `Filter: ${tag}`;
            tagDropdown.style.display = 'none';
            applyFiltersAndSort();
          });
          tagDropdown.appendChild(b);
        });
      }

      tagFilterBtn.addEventListener('click', () => {
        tagDropdown.style.display = tagDropdown.style.display === 'flex' ? 'none' : 'flex';
      });

      // Filter & sort logic
      function applyFiltersAndSort() {
        let filtered = [...allNotes];

        // Search
        if (currentSearchTerm.trim() !== '') {
          const results = idx.search(currentSearchTerm);
          const matchedUrls = new Set(results.map(r => r.ref));
          filtered = filtered.filter(note => matchedUrls.has(note.url));
        }

        // Tag filter
        if (currentTag) {
          filtered = filtered.filter(note => note.tags.includes(currentTag));
        }

        // Sort
        const sortVal = sortSelect.value;
        if (sortVal === 'date-desc') filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
        else if (sortVal === 'date-asc') filtered.sort((a,b) => new Date(a.date) - new Date(b.date));
        else if (sortVal === 'title-asc') filtered.sort((a,b) => a.title.localeCompare(b.title));
        else if (sortVal === 'title-desc') filtered.sort((a,b) => b.title.localeCompare(a.title));

        renderCards(filtered);
        noResults.style.display = filtered.length === 0 ? 'block' : 'none';
      }

      function renderCards(notes) {
        notesContainer.innerHTML = notes.map(note => `
          <a href="${note.url}" class="note-card">
            <div class="card-date">${new Date(note.date).toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'})}</div>
            ${note.tags.length ? `<div class="card-tags">${note.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>` : ''}
            <div class="card-title">${escapeHtml(note.title)}</div>
            <div class="card-excerpt">${escapeHtml(note.excerpt || '')}</div>
          </a>
        `).join('');
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Event listeners
      searchInput.addEventListener('input', () => {
        currentSearchTerm = searchInput.value;
        applyFiltersAndSort();
      });
      sortSelect.addEventListener('change', applyFiltersAndSort);

    })();
  </script>
  {% endif %}
</body>
</html>
